[workspace]
resolver = "2"
members = [
    "crates/bible-core",
    "crates/bible-ui",
    "crates/omarchy-bible",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
bible-core = { path = "crates/bible-core" }
bible-ui = { path = "crates/bible-ui" }
gpui-omarchy = "0.1"
gpui = { package = "gpui-kit", version = "=0.6.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

# gpui-pre-macros 0.3.1 leaves a helper ungated in release builds while its
# module is gated on debug_assertions. Enable it for the host proc-macro only.
[profile.release.package.gpui-pre-macros]
debug-assertions = true

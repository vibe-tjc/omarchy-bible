[workspace]
resolver = "2"
members = [
    "crates/bible-core",
    "crates/omarchy-bible",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
bible-core = { path = "crates/bible-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
nsh-core = "0.4.0"
nsh-base = "0.4.0"
nsh-platform-linux = { version = "0.4.0", default-features = false }
nsh-platform-macos = { version = "0.4.0", default-features = false }
nsh-engine = { version = "0.4.0", default-features = false }
nsh-testing = { version = "0.4.0", default-features = false }

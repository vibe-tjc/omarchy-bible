[workspace]
resolver = "2"
members = [
    "crates/bible-core",
    "crates/bible-ui",
    "crates/omarchy-bible",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
bible-core = { path = "crates/bible-core" }
bible-ui = { path = "crates/bible-ui" }
gpui = "0.2.2"
gpui-component = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
      asset: ${{ steps.meta.outputs.asset }}
    steps:
      - name: Version from tag
        id: meta
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *) echo "Tag must look like v0.1.0, got: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=omarchy-bible-${VERSION}-x86_64.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: System libraries for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev libvulkan-dev libfontconfig1-dev \
            pkg-config cmake g++

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p omarchy-bible --locked

      - name: Package
        run: |
          bash packaging/scripts/package-linux.sh \
            "${{ steps.meta.outputs.version }}" \
            target/release/omarchy-bible

      - name: Checksums
        working-directory: dist
        run: sha256sum "${{ steps.meta.outputs.asset }}" | tee SHA256SUMS

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/${{ steps.meta.outputs.asset }}
            dist/SHA256SUMS

      - name: Fill AUR PKGBUILD
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          SHA="$(cut -d' ' -f1 dist/SHA256SUMS)"
          mkdir -p dist/aur
          sed \
            -e "s/@PKGVER@/${VERSION}/g" \
            -e "s/@SHA256@/${SHA}/g" \
            packaging/omarchy-bible-bin/PKGBUILD.in \
            > dist/aur/PKGBUILD

      - uses: actions/upload-artifact@v4
        with:
          name: aur-pkgbuild
          path: dist/aur/PKGBUILD

  release-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Version from tag
        id: meta
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *) echo "Tag must look like v0.1.0, got: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset_tgz=omarchy-bible-${VERSION}-macos-arm64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "asset_dmg=omarchy-bible-${VERSION}-macos-arm64.dmg" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build
        run: cargo build --release -p omarchy-bible --locked

      - name: Package
        run: |
          bash packaging/scripts/package-macos.sh \
            "${{ steps.meta.outputs.version }}" \
            target/release/omarchy-bible

      - name: Checksums
        working-directory: dist
        run: |
          shasum -a 256 \
            "${{ steps.meta.outputs.asset_tgz }}" \
            "${{ steps.meta.outputs.asset_dmg }}" \
            | tee SHA256SUMS-macos-arm64

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/${{ steps.meta.outputs.asset_tgz }}
            dist/${{ steps.meta.outputs.asset_dmg }}
            dist/SHA256SUMS-macos-arm64
